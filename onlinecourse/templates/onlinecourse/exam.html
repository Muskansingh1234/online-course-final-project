<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mock exam – {{ course.name }}</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="bg-light"><main class="container py-5">
<h1 class="h2 mb-4">Mock exam: {{ course.name }}</h1>
<form method="post" action="{% url 'onlinecourse:submit' course.id %}">{% csrf_token %}
{% for question in questions %}
<section class="card mb-3"><div class="card-body">
<h2 class="h5">{{ forloop.counter }}. {{ question.question_text }}</h2>
{% for choice in question.choices.all %}
<div class="form-check"><input class="form-check-input" type="radio" name="question_{{ question.id }}" id="choice_{{ choice.id }}" value="{{ choice.id }}">
<label class="form-check-label" for="choice_{{ choice.id }}">{{ choice.choice_text }}</label></div>
{% endfor %}
</div></section>
{% empty %}<p>No exam questions are available yet. Add questions in the admin site.</p>{% endfor %}
<button class="btn btn-success" type="submit" {% if not questions %}disabled{% endif %}>Submit exam</button>
</form></main></body></html>
